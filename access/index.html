<style>
*{box-sizing:border-box}body{margin:0;background:#101c16;color:#f2f5ef;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:100%;max-width:440px}header{color:#c5ec96;font-size:13px;letter-spacing:.13em;font-weight:700;margin-bottom:64px}.lock{width:48px;height:48px;margin-bottom:24px;color:#c5ec96}h1{font-size:clamp(28px,6vw,35px);letter-spacing:-.055em;margin:0 0 16px}p{color:#b5c5b8;font-size:16px;line-height:1.8;margin:0 0 30px}label{display:block;font-size:14px;margin-bottom:10px}input,button{font:inherit;width:100%;min-height:52px;border-radius:6px}input{border:1px solid #66846e;background:#1a2c21;color:white;padding:14px}button{border:0;background:#c5ec96;color:#172715;font-weight:700;margin-top:16px;cursor:pointer}button:hover{background:#d6f5b2}button:disabled{opacity:.65;cursor:wait}input:focus-visible,button:focus-visible{outline:2px solid #e1f7c7;outline-offset:4px}#status{color:#ffc4ae;margin:14px 0 0;font-size:14px;min-height:25px}footer{margin-top:32px;color:#8b9f8f;font-size:12px;border-top:1px solid #344b3a;padding-top:20px}
</style>
</head><body><main><header>UMC PRODUCT</header>
<svg class="lock" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="10" y="21" width="28" height="22" rx="5" stroke="currentColor" stroke-width="2"/><path d="M16 21v-7a8 8 0 0116 0v7M24 30v5" stroke="currentColor" stroke-width="2"/></svg>
<h1>인수인계를 준비하고 있어요.</h1><p>검토 중인 내부 문서입니다.<br>전달받은 비밀번호를 입력해 주세요.</p>
<form method="post"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" aria-describedby="status"><button type="submit" disabled>문서 열기 →</button><p id="status" role="status" aria-live="polite"></p></form>
